$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |

      const getVar = (k) => pm.environment.get(k) || pm.collectionVariables.get(k);
      const setVar = (k, v) => {
          pm.environment.set(k, v);
          pm.collectionVariables.set(k, v);
      };

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns correct product detail", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data.id).to.eql(getVar("productId"));
      });
    language: text/javascript
order: 2000
