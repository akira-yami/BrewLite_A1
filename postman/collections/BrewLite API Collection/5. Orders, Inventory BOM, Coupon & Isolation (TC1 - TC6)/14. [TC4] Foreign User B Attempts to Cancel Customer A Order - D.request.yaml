$kind: http-request
name: 14. [TC4] Foreign User B Attempts to Cancel Customer A Order -> Denied (404)
url: "{{baseUrl}}/orders/{{orderId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerBToken}}
scripts:
  - type: afterResponse
    code: |

      pm.test("[TC4] Status code is 404 ORDER_NOT_FOUND", function () {
          pm.response.to.have.status(404);
          pm.expect(pm.response.json().error.code).to.eql("ORDER_NOT_FOUND");
      });
    language: text/javascript
order: 14000
