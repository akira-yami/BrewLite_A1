name: VNPAY E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: ''0 2 * * *''
  workflow_dispatch:

jobs:
  vnpay-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VNPAY_ENABLED: true
      VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE_SANDBOX }}
      VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET_SANDBOX }}
      VNPAY_PAYMENT_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_QUERY_URL: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      VNPAY_RETURN_URL: http://localhost:3101/api/v1/payments/vnpay/return
      VNPAY_IPN_URL: http://localhost:3101/api/v1/payments/vnpay/ipn
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brewlite_test
      E2E_API_URL: http://localhost:3101/api/v1
      E2E_WEB_PORT: 3100
      E2E_API_PORT: 3101

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brewlite_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ''24''

      - name: Install API dependencies
        run: npm ci --prefix apps/api

      - name: Install Web dependencies
        run: npm ci --prefix apps/web

      - name: Run database migrations
        run: npm run prisma:migrate:deploy --prefix apps/api

      - name: Seed test database
        run: npm run db:seed --prefix apps/api
        continue-on-error: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run VNPAY E2E tests
        run: npm run test:e2e:vnpay --prefix apps/web

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-vnpay
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-vnpay
          path: apps/web/test-results/
          retention-days: 7
