$kind: http-request
name: 03. [TC7] Replay Failed Payment Key -> Idempotent Replay (No Duplicate Attempt)
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
  Idempotency-Key: "{{failedPaymentKey}}"
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "CARD"
    }
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[TC7] Replaying failed Idempotency-Key returns cached FAILED (isRetried=true)", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.success).to.be.false;
          pm.expect(jsonData.data.isRetried).to.be.true;
          pm.expect(jsonData.data.status).to.eql("FAILED");
      });
    language: text/javascript
order: 3000
