$kind: http-request
url: "{{baseUrl}}/payments/{{paymentId}}/recovery"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{operatorToken}}
  Idempotency-Key: "{{operatorRecKey}}"
body:
  type: json
  content: |-
    {
      "incidentReference": "INC-VNPAY-CHECK-01"
    }
scripts:
  - type: beforeRequest
    code: |

      const getVar = (k) => pm.environment.get(k) || pm.collectionVariables.get(k);
      const setVar = (k, v) => {
          pm.environment.set(k, v);
          pm.collectionVariables.set(k, v);
      };

      setVar("operatorRecKey", "rec_op_" + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |

      pm.test("Status code is 409 Conflict (PAYMENT_NOT_RECONCILABLE)", function () {
          pm.response.to.have.status(409);
      });
    language: text/javascript
order: 16000
