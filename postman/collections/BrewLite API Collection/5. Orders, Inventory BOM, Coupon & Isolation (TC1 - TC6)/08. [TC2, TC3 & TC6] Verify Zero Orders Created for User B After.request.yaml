$kind: http-request
name: 08. [TC2, TC3 & TC6] Verify Zero Orders Created for User B After All Rejections
url: "{{baseUrl}}/orders/me"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerBToken}}
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[TC2, TC3 & TC6] Rejected requests did NOT create any order in DB", function () {
          var jsonData = pm.response.json();
          const orders = Array.isArray(jsonData.data) ? jsonData.data : (jsonData.data.items || []);
          pm.expect(orders).to.be.an("array").that.is.empty;
      });
    language: text/javascript
order: 8000
