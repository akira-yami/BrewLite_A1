$kind: http-request
url: "{{baseUrl}}/staff/inventory"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
