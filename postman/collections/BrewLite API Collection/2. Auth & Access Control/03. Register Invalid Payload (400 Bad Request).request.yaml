$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "a",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
