$kind: http-request
url: "{{baseUrl}}/products/not-a-valid-uuid"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
