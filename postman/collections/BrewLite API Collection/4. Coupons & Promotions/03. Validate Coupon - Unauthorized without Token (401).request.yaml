$kind: http-request
url: "{{baseUrl}}/coupons/validate"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "BREW10-DEMO",
      "subtotal": 50000
    }
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
