$kind: http-request
name: 06. [TC7] Replay Successful Payment Key -> Idempotent Replay (No Duplicate Payment)
url: "{{baseUrl}}/payments"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerToken}}
  Idempotency-Key: "{{paymentIdempotencyKey}}"
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "method": "E_WALLET"
    }
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[TC7] Returns idempotent payment replay without double-charging", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.success).to.be.true;
          pm.expect(jsonData.data.isRetried).to.be.true;
          pm.expect(jsonData.data.status).to.eql("SUCCEEDED");
      });
    language: text/javascript
order: 6000
