$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "customer01",
      "password": "Customer@123"
    }
scripts:
  - type: afterResponse
    code: |

      const getVar = (k) => pm.environment.get(k) || pm.collectionVariables.get(k);
      const setVar = (k, v) => {
          pm.environment.set(k, v);
          pm.collectionVariables.set(k, v);
      };

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Saves customer A token & ID", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data).to.have.property("accessToken");
          pm.expect(jsonData.data.user.role).to.eql("CUSTOMER");
          setVar("customerToken", jsonData.data.accessToken);
          setVar("customerId", jsonData.data.user.id);
      });
    language: text/javascript
order: 4000
