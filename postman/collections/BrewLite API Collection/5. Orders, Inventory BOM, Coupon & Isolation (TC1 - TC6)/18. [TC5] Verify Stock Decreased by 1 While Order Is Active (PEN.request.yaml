$kind: http-request
name: 18. [TC5] Verify Stock Decreased by 1 While Order Is Active (PENDING)
url: "{{baseUrl}}/staff/inventory?limit=100"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{baristaToken}}
queryParams:
  limit: "100"
scripts:
  - type: afterResponse
    code: |

      const getVar = (k) => pm.environment.get(k) || pm.collectionVariables.get(k);
      const setVar = (k, v) => {
          pm.environment.set(k, v);
          pm.collectionVariables.set(k, v);
      };

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[TC5] Cup stock is reduced by 1 during active reservation", function () {
          const items = pm.response.json().data;
          const cup = items.find((i) => i.code === (getVar("cupCode") || "CUP_S"));
          pm.expect(cup.stockQuantity).to.eql(Number(getVar("cupStockBeforeCancelFlow")) - 1);
      });
    language: text/javascript
order: 18000
