$kind: http-request
name: 23. [TC6] Verify Single-Use Coupon Released & Usable Again After Order Cancel
url: "{{baseUrl}}/coupons/validate"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{customerBToken}}
body:
  type: json
  content: |-
    {
      "code": "BREW10-TEST01",
      "subtotal": 50000
    }
scripts:
  - type: afterResponse
    code: |

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[TC6] Coupon status transitioned RESERVED -> RELEASED on cancel", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.data.code).to.eql("BREW10-TEST01");
          pm.expect(jsonData.data.discountAmount).to.eql(5000);
      });
    language: text/javascript
order: 23000
