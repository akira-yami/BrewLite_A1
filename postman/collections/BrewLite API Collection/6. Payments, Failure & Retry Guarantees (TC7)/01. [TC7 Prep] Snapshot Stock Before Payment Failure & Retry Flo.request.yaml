$kind: http-request
name: 01. [TC7 Prep] Snapshot Stock Before Payment Failure & Retry Flow
url: "{{baseUrl}}/staff/inventory?limit=100"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{baristaToken}}
queryParams:
  limit: "100"
scripts:
  - type: afterResponse
    code: |

      const getVar = (k) => pm.environment.get(k) || pm.collectionVariables.get(k);
      const setVar = (k, v) => {
          pm.environment.set(k, v);
          pm.collectionVariables.set(k, v);
      };

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Snapshots cupStockBeforePayment (already reserved during order creation)", function () {
          const items = pm.response.json().data;
          const cup = items.find((i) => i.code === (getVar("cupCode") || "CUP_S"));
          setVar("cupStockBeforePayment", String(cup.stockQuantity));
      });
    language: text/javascript
order: 1000
