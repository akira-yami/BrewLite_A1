$kind: http-request
name: 09. [TC3 & TC6] Verify Ingredient Stock Unchanged & Non-Negative After Rejections
url: "{{baseUrl}}/staff/inventory?limit=100"
method: GET
headers:
  Content-Type: application/json
  Authorization: Bearer {{baristaToken}}
queryParams:
  limit: "100"
scripts:
  - type: afterResponse
    code: |

      const getVar = (k) => pm.environment.get(k) || pm.collectionVariables.get(k);
      const setVar = (k, v) => {
          pm.environment.set(k, v);
          pm.collectionVariables.set(k, v);
      };

      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("[TC3 & TC6] Cup stock unchanged after failed variant/coupon/oversell & no negative stock", function () {
          const items = pm.response.json().data;
          const cupCode = getVar("cupCode") || "CUP_S";
          const cup = items.find((i) => i.code === cupCode);
          pm.expect(cup.stockQuantity).to.eql(Number(getVar("cupStockAfterValidOrder")));
          items.forEach((ing) => {
              pm.expect(ing.stockQuantity, ing.code + " must be >= 0").to.be.at.least(0);
          });
      });
    language: text/javascript
order: 9000
